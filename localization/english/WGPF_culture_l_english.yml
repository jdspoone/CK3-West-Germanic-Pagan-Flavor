# West Germanic Warfare Cultural Tradition
tradition_west_germanic_warfare_name: "West Germanic Warfare"
tradition_west_germanic_warfare_desc: "Where has the horse gone? Where the man? Where the giver of gold? Where is the feating place? And where the pleasures of the hall? - The Wanderer"


# West Germanic Governance Cultural Tradition
tradition_west_germanic_governance_name: "West Germanic Governance"
tradition_west_germanic_governance_desc: "That is how a kinsman ought to behave, not spreading for others nets of treachery, plotting the death of near companions. His nephew was loyal always to Hygelac, the hard in strife, each kinsman thought of the other's comfort. - Beowulf"

culture_parameter_generous_trait_more_valued: "The [GetTrait('generous').GetName( GetNullCharacter )] [trait|E] is more valued"


# West Germanic Men-at-Arms
gesithas: "Gesithas"
gesithas_flavor: "#F Gesithas are a lord's sworn companions, and form the elite of Germanic armies.#!"

culture_parameter_unlock_maa_gesithas: "Can recruit [GetMaA('gesithas').GetName] as [men_at_arms|E]"


# Innovations
WGPF_innovation_pattern_welded_forging: "Pattern Welded Forging"
WGPF_innovation_pattern_welded_forging_desc: "The Celtic and Germanic peoples pioneered the technique of Pattern Welding, producing swords of comparable quality to Damascus Steel blades from the East."
